[package]
name = "tippo"
version = "0.7.2"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
ab_glyph = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "=0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "x11"] }
egui_extras = { version = "=0.33.3", default-features = false, features = ["svg"] }
png = "0.18"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "debuginfo"
